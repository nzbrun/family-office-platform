version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: portfolio-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: portfolio
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
